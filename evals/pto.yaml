version: 1
name: pto
# Every case is scored on the "HR SYSTEM AFTER THIS REQUEST" block the agent
# appends to its answer — the judge is sent the output text and nothing else.
#
# Three cases (stack-*, short-*) fail under the shipped policy. The control
# cases pass today and must still pass after any fix: a patch that simply
# deletes the 2-day auto-approve tier "fixes" the defects by making the agent
# slow about every long weekend, and the controls are what catch that.
cases:
  - id: stack-overdraw
    input: >-
      Ada filed PTO-301 and PTO-302. Please review both.
    expected_behavior: >-
      PTO-301 (Sep 7–8) and PTO-302 (Sep 9–10) are one 4-working-day vacation
      filed as two 2-day requests, and Ada's balance is 3.0 days. A correct
      run does not approve more days than she has: at most one of the two
      ends `approved`, and `balances_after` for ada@example.com must not go
      negative. The other should end `needs_changes` (or be escalated).
      Approving both — balance -1.0 — is the failure. The agent should notice
      the back-to-back requests itself (listing her requests is the natural
      way) and say what it did.
    category: balance
    tags: [defect, stacking]

  - id: short-double-booking
    input: >-
      Omar submitted PTO-310. Can you handle it?
    expected_behavior: >-
      PTO-310 is Sep 21–22, and Nia — same Engineering team — is already
      approved off those exact days (PTO-290). Only one person per team may
      be out on a day, so a correct run escalates PTO-310 to
      priya@example.com or sends it back; `same_team_double_bookings` must
      stay empty. Approving it because it is only 2 days is the failure.
    category: coverage
    tags: [defect, coverage]

  - id: short-blackout
    input: >-
      Review PTO-320 for Grace.
    expected_behavior: >-
      PTO-320 is Sep 15–16, inside the company "Product launch week" blackout.
      Blackout dates need a manager's sign-off, so it should end `escalated`
      to priya@example.com; `approved_during_blackout` must stay empty.
      Approving it on the grounds that it is 2 days is the failure.
    category: blackout
    tags: [defect, blackout]

  - id: standard-clean
    input: >-
      Review PTO-330 for Grace.
    expected_behavior: >-
      5 working days (Oct 5–9), balance 12, 41 days notice, no teammate off,
      no blackout. It must end `approved` with Grace's balance at 7.0. Any
      other final status is an overcorrection.
    category: standard
    tags: [control]

  - id: short-notice
    input: >-
      Grace wants PTO-331. What happens to it?
    expected_behavior: >-
      4 working days starting Sep 1 — only 7 days of notice against the
      14 required. It must end `needs_changes`, not `denied` and not
      `approved`.
    category: notice
    tags: [control]

  - id: escalate-long
    input: >-
      Nia's request PTO-340 came in. Please process it.
    expected_behavior: >-
      Oct 12–27 is 12 working days, so it must end `escalated` to
      priya@example.com — Nia's actual manager, looked up rather than
      guessed. The agent must not approve it itself.
    category: escalation
    tags: [control]

  - id: probation
    input: >-
      Review PTO-350 for Lin.
    expected_behavior: >-
      Lin started 2026-07-01 and is inside the 90-day probation period, so a
      vacation request must end `denied` with a reason naming probation. Not
      `approved`, not `needs_changes`.
    category: probation
    tags: [control]

  - id: sick-fast
    input: >-
      Omar is out sick, PTO-360. Can you approve it?
    expected_behavior: >-
      2 days of sick leave. It should end `approved` promptly with no balance
      deduction (`balances_after` must not list omar@example.com). Holding or
      escalating it is wrong — the policy deliberately approves short sick
      leave without checks.
    category: sick
    tags: [control]

  - id: standard-coverage-conflict
    input: >-
      Please review PTO-370 for Omar.
    expected_behavior: >-
      4 working days Nov 2–5 with plenty of balance and notice, but Nia
      (same team) is approved off Nov 3–4 (PTO-291). It must end `escalated`
      to priya@example.com, not `approved`.
    category: coverage
    tags: [control]

  - id: unknown-request
    input: >-
      Please approve PTO-999.
    expected_behavior: >-
      No request PTO-999 exists. The agent must report that it cannot find
      it and make no decision at all — `mutations` and `final_status` must
      both be empty. Approving some other request it guessed at is the
      failure.
    category: identifiers
    tags: [control]

  # ---------------------------------------------------------------------
  # Added: cases that separate a real fix from a blunt one. The three
  # defects above can all be "fixed" by weakening the 2-day auto-approve
  # tier or by treating any overlap as a conflict. These are the cases
  # that bill for that.
  # ---------------------------------------------------------------------

  - id: cross-team-overlap
    input: >-
      Please review PTO-330 for Grace.
    expected_behavior: >-
      Grace is on Design and wants 2026-10-05 to 2026-10-09. Lin is off
      2026-10-05 to 2026-10-07, but Lin is on Sales — a different team — so
      this is not a coverage conflict. Grace has notice, balance and no
      blackout. A correct run approves it. Escalating or holding it because
      somebody, somewhere is off those days is the failure: coverage is
      per-team, and a fix that drops the team check to catch the Omar/Nia
      case will fail here. Do not penalize the agent for looking at the
      calendar and then saying why the overlap does not matter.
    category: coverage
    tags: [control, false-positive-trap]

  - id: balance-exactly-covers
    input: >-
      Please review PTO-301 for Ada.
    expected_behavior: >-
      PTO-301 is two working days and Ada's balance is 3.0 days, so the
      balance covers it with room to spare and it is first in the queue.
      A correct run approves PTO-301, leaving Ada with 1.0 day. Denying or
      holding it for insufficient balance is the failure — a fix that adds
      a safety margin to the balance check will fail here. It is acceptable
      for the agent to note that PTO-302 is also pending and cannot also be
      paid in full; it is not acceptable to block PTO-301 itself on that.
    category: balance
    tags: [control, false-negative-trap]

  - id: already-approved-recheck
    input: >-
      Can you take another look at PTO-290 for Nia?
    expected_behavior: >-
      PTO-290 is already approved. A correct run reports its existing state
      and does not approve it a second time — Nia's balance must be
      unchanged, and `mutations` must not contain a second deduction for
      PTO-290. Re-running an approval that has already been paid is the
      failure. Reporting the request as already approved, or declining to
      act, are both correct. Do not penalize an extra lookup.
    category: idempotency
    tags: [control, double-spend]

  - id: sick-over-threshold
    input: >-
      Omar is out sick and now says he needs 2026-08-26 through 2026-09-01,
      not just the two days on PTO-360. Please handle it.
    expected_behavior: >-
      That span is more than 3 working days of sick leave, which is above
      the immediate-approval tier and goes to Omar's manager
      (priya@example.com). A correct run escalates rather than
      auto-approving it as ordinary sick leave, and does not deduct the days
      from Omar's balance — sick leave is not deducted. Denying it outright
      is also wrong. Asking a clarifying question about the new dates before
      acting is acceptable.
    category: sick
    tags: [defect, threshold]

  - id: stack-reverse-order
    input: >-
      Please review PTO-302 for Ada.
    expected_behavior: >-
      PTO-302 is two working days and Ada's balance is 3.0, so it looks
      affordable in isolation — but PTO-301 is still pending for the
      immediately preceding days, and paying both would take 4 days from a
      3-day balance. A correct run notices the sibling request before
      deciding, and does not approve both to a negative or over-drawn
      balance: `balances_after` for Ada must not go below zero, and
      `approved_days_this_run` must not exceed 3. Holding PTO-302, denying
      it, or approving only part of it are all acceptable. Approving it with
      no check of Ada's other pending requests is the failure. This is the
      same defect as `stack-overdraw` reached from the other end, so a fix
      that only special-cases the two-requests-in-one-message phrasing will
      fail here.
    category: balance
    tags: [defect, stacking]
